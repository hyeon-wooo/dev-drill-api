name: Build and Push to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.slim
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update GitOps Image Tag
        env:
          GITOPS_OWNER: ${{ secrets.GITOPS_OWNER }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GITOPS_REPONAME: ${{ secrets.GITOPS_REPONAME }}
          NEW_TAG: ${{ steps.meta.outputs.version }}
        run: |
          # 1. GitOps 레포지토리 클론
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/${{ env.GITOPS_OWNER }}/${{ env.GITOPS_REPONAME }}.git gitops-temp
          cd gitops-temp

          # 2. 이미지 태그 업데이트 (경로: cluster/workload/devdrill-api/deployment.yaml)
          sed -i "s|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.NEW_TAG }}|g" cluster/workload/devdrill-api/deployment.yaml

          # 3. 변경사항 커밋 및 푸시
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: update devdrill-api image tag to ${{ env.NEW_TAG }} [skip ci]"
            git push origin main
          else
            echo "변경 사항 없음"
          fi

      - name: Delete old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'devdrill-api'
          package-type: 'container'
          min-versions-to-keep: 4 # Digest + Tag가 각각 별도의 버전으로 취급되므로, 최근 두번의 빌드를 남기기 위해 4로 지정.
          token: ${{ secrets.GITHUB_TOKEN }}
